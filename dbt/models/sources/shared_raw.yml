version: 2

# Bronze: SHARED_DB.RAW, as the loaders left it (add-only; text exactly as in
# each file). Silver reads only the latest file of each data set
# (macros/latest_file.sql).
sources:
  - name: shared_raw
    database: SHARED_DB
    schema: RAW
    tables:
      - name: source_file
        identifier: SOURCE_FILE
        description: One row per file loaded into SHARED_DB.RAW, with its source, licence and counts.
      - name: onspd
        identifier: ONSPD
        description: The ONS Postcode Directory in full, one row per postcode ever used (load:data step 32). Columns named as in the file, in lower case.
      - name: published_cell
        identifier: PUBLISHED_CELL
        description: Files with varying layouts, one row per cell. The postcode directory's code-to-name lookups are here (source onspd-lookups).
      - name: neso_dno_area
        identifier: NESO_DNO_AREA
        description: The 14 GB electricity regions (DNO licence areas), approximate boundaries in British National Grid, one GeoJSON feature per row.
      - name: nomis_population_lsoa
        identifier: NOMIS_POPULATION_LSOA
        description: Population estimates by 2021 LSOA (England), every year from 2011, in broad age bands (Nomis NM_2014_1, load:data step 33).
      - name: iod2025_lsoa
        identifier: IOD2025_LSOA
        description: The English Indices of Deprivation 2025, one row per 2021 LSOA (England), columns named as in the file.
      - name: police_street_crime
        identifier: POLICE_STREET_CRIME
        description: police.uk street-level crimes, latest 3-year archive, one row per crime (load:data step 35).
      - name: apar_provider
        identifier: APAR_PROVIDER
        description: The apprenticeship provider and assessment register, one row per UKPRN (load:data step 34).
      - name: soc2020_framework
        identifier: SOC2020_FRAMEWORK
        description: The ONS SOC 2020 framework, every group with its code and title (load:data, soc-coding-index).
      - name: se_occupation
        identifier: SE_OCCUPATION
        description: Every Skills England occupational maps API response, by run (scripts/import-skills.js), with each occupation's SOC codes.
      - name: se_standard_version
        identifier: SE_STANDARD_VERSION
        description: Every apprenticeship standard version from Skills England's standards API, by run, with its LARS code, occupation and options.
      - name: ashe_occupation
        identifier: ASHE_OCCUPATION
        description: ASHE Tables 14 (UK) and 15 (work region) by SOC 2020, 2024 revised and 2025 provisional, one row per spreadsheet row; a files are the figures, b files their coefficients of variation.

  # SHARED_DB.EXT: data kept up to date by the app's own imports (not files).
  - name: shared_ext
    database: SHARED_DB
    schema: EXT
    tables:
      - name: vacancy
        identifier: VACANCY
        description: Every apprenticeship advert seen by the vacancy import (Find an apprenticeship, with NHS Jobs and Civil Service Jobs), one row per advert, live or gone (GONEAT), updated every 2 hours.
      - name: vacancy_soc
        identifier: VACANCY_SOC
        description: SOC 2020 codes for the adverts (scripts/vacancy-soc.js), one row per advert and code; a code that stops applying is marked GONEAT, never deleted.
      - name: website_link
        identifier: WEBSITE_LINK
        description: Every institution website link in silver and its latest state from the weekly link check (scripts/check-website-links.js), one row per link.

  # OPTIONS_DB.RAW: the school leavers app's official data, as loaded.
  - name: options_raw
    database: OPTIONS_DB
    schema: RAW
    tables:
      - name: source_file
        identifier: SOURCE_FILE
        description: One row per file loaded into OPTIONS_DB.RAW, with its source, licence and counts.
      - name: gias_establishment
        identifier: GIAS_ESTABLISHMENT
        description: Get Information about Schools, every establishment open or closed, one row per URN (head teacher and proprietor columns left out before loading).
      - name: ofsted_schools_most_recent
        identifier: OFSTED_SCHOOLS_D2_MOST_RECENT
        description: Ofsted's state-funded schools management information, most recent inspections, one row per URN.
      - name: ofsted_fe_provider_list
        identifier: OFSTED_FE_D4_PROVIDER_LIST
        description: Ofsted's further education and skills providers, one row per provider URN and UKPRN, with the latest inspection before the renewed framework.
      - name: ofsted_fe_full_inspections
        identifier: OFSTED_FE_D1_FULL_INSPECTIONS
        description: Ofsted's further education and skills full inspections under the renewed framework, this year.
      - name: performance_16_18
        identifier: PERFORMANCE_16_18_INSTITUTION
        description: 16 to 18 results by institution (URN), year, cohort and disadvantage status (Explore education statistics).
      - name: ks4_performance_school
        identifier: KS4_PERFORMANCE_SCHOOL
        description: Key stage 4 results by school (URN), year and breakdown.
      - name: achievement_et
        identifier: ACHIEVEMENT_ET_PROVIDER_SUMMARY
        description: Education and training achievement rates by provider (UKPRN), year, age band and subject area.
      - name: achievement_app
        identifier: ACHIEVEMENT_APP_PROVIDER
        description: Apprenticeship achievement rates by provider (UKPRN), year, age, level and standard; two publications whose years overlap.
      - name: du_kiscourse
        identifier: DISCOVERUNI_KISCOURSE
        description: Discover Uni courses, one row per publishing UKPRN, course ID and mode.
      - name: du_institution
        identifier: DISCOVERUNI_INSTITUTION
        description: Discover Uni institutions (names, address, country).
      - name: du_sbj
        identifier: DISCOVERUNI_SBJ
        description: Discover Uni course subjects (CAH codes), one or more per course.
      - name: du_kisaim
        identifier: DISCOVERUNI_KISAIM
        description: Discover Uni qualification codes and names (BA, BSc...).
      - name: du_continuation
        identifier: DISCOVERUNI_CONTINUATION
        description: Discover Uni continuation figures, one row per course and subject.
      - name: du_gosalary
        identifier: DISCOVERUNI_GOSALARY
        description: Discover Uni Graduate Outcomes salaries 15 months after graduating, one row per course and subject.
      - name: du_leo3
        identifier: DISCOVERUNI_LEO3
        description: Discover Uni LEO earnings 3 years after graduating, one row per course and subject.
      - name: leo_grad_cah3_subject
        identifier: LEO_GRAD_CAH3_SUBJECT
        description: LEO graduate outcomes by CAH3 subject; used here only for the CAH3 subject names.
