version: 2

# Shared gold for jobs (SHARED_DB.GOLD; the gold plan, 14 October 2026),
# read by Warren and Burrow, Meadow (the CRM) and the school leavers app
# (meta.readers, scripts/gold-readers.js). Nothing is ranked.

models:

  - name: vacancy_card
    description: >-
      The adverts a product may show, one row per advert open when gold was
      built: what it is (KIND: Apprenticeship, or Job, never a funded
      apprenticeship), where, its SOC 2020 occupations and its standard. Built
      daily; the adverts change every 2 hours, so AS_OF says when this list
      was made.
    config:
      meta:
        source: faa-vacancies,soc-coding-index,onspd
        licence: ogl-3
        attribution: 'Contains public sector information licensed under the Open Government Licence v3.0. NHS Jobs and Civil Service Jobs adverts come through the same API; their re-use terms are assumed, not confirmed.'
        refresh: daily
        sensitivity: public
        readers: ['SHARED_DB.GOLD_WARREN', 'SHARED_DB.GOLD_MEADOW', 'SHARED_DB.GOLD_SITE']
    columns:
      - name: vacancy_reference
        data_type: varchar
        description: 'The adverts reference.'
        data_tests:
          - unique
          - not_null
      - name: kind
        data_type: varchar
        description: 'Apprenticeship (from the apprenticeship sources) or Job (from a jobs source: never a funded apprenticeship).'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Apprenticeship', 'Job']
      - name: kind_words
        data_type: varchar
        description: 'KIND as the product must show it: Apprenticeship, or Job (not a funded apprenticeship).'
        data_tests:
          - not_null
      - name: title
        data_type: varchar
        description: 'The adverts title.'
        data_tests:
          - not_null
      - name: employer_name
        data_type: varchar
        description: 'The employer.'
      - name: provider_name
        data_type: varchar
        description: 'The training provider.'
      - name: ukprn
        data_type: varchar
        description: 'The training providers UKPRN.'
      - name: positions
        data_type: number(38,0)
        description: 'How many people it is for.'
      - name: posted_at
        data_type: timestamp_ltz
        description: 'When it was posted.'
      - name: closing_at
        data_type: timestamp_ltz
        description: 'When applications close (after AS_OF).'
        data_tests:
          - not_null
      - name: starts_at
        data_type: timestamp_ltz
        description: 'When it starts.'
      - name: wage_type
        data_type: varchar
        description: 'The kind of wage, as published.'
      - name: wage_unit
        data_type: varchar
        description: 'What the wage is per.'
      - name: wage_text
        data_type: varchar
        description: 'The wage as the advert words it.'
      - name: hours_per_week
        data_type: number(6,2)
        description: 'Hours a week.'
      - name: expected_duration
        data_type: varchar
        description: 'How long it lasts, as worded.'
      - name: apprenticeship_level
        data_type: varchar
        description: 'Its level, as published.'
      - name: lars_code
        data_type: number(38,0)
        description: 'The apprenticeship standards LARS code.'
      - name: course_title
        data_type: varchar
        description: 'The standards title.'
      - name: course_level
        data_type: number(38,0)
        description: 'The standards level.'
      - name: route
        data_type: varchar
        description: 'The standards route.'
      - name: is_disability_confident
        data_type: boolean
        description: 'True when the employer is Disability Confident.'
      - name: is_national
        data_type: boolean
        description: 'True for an advert across the country.'
      - name: postcode
        data_type: varchar
        description: 'The workplace postcode as the advert gives it.'
      - name: local_authority_code
        data_type: varchar
        description: 'Its local authority, from the postcode.'
        config:
          meta:
            source: 'onspd'
            attribution: 'Source: Office for National Statistics, licensed under the Open Government Licence v3.0. Contains OS data © Crown copyright and database right 2026. Contains Royal Mail data © Royal Mail copyright and database right 2026.'
      - name: local_authority_name
        data_type: varchar
        description: 'That local authoritys name.'
      - name: region_name
        data_type: varchar
        description: 'Its region (or Wales, Scotland).'
      - name: lsoa21_code
        data_type: varchar
        description: 'Its 2021 LSOA, from the postcode.'
      - name: latitude
        data_type: float
        description: 'Latitude, as the advert gives it.'
      - name: longitude
        data_type: float
        description: 'Longitude, as the advert gives it.'
      - name: soc_codes
        data_type: varchar
        description: 'Its current SOC 2020 unit groups, joined with commas.'
      - name: soc_titles
        data_type: varchar
        description: 'Those occupations with their ONS titles.'
        config:
          meta:
            source: 'soc-coding-index'
            attribution: 'Source: Office for National Statistics, licensed under the Open Government Licence v3.0.'
      - name: soc_method
        data_type: varchar
        description: 'How the occupations were coded (title-confirmed, standard, title).'
      - name: vacancy_url
        data_type: varchar
        description: 'Its page on the listing site.'
      - name: listed_on
        data_type: varchar
        description: 'Where it is listed: FAA (Find an apprenticeship), NHS (NHS Jobs) or CSJ (Civil Service Jobs).'
        data_tests:
          - not_null
      - name: source
        data_type: varchar
        description: 'The data set it is from.'
        data_tests:
          - not_null
      - name: last_seen_at
        data_type: timestamp_ltz
        description: 'When the vacancy import last found it.'
      - name: as_of
        data_type: timestamp_ltz
        description: 'When this list was made (golds build).'
        data_tests:
          - not_null

  - name: job_outlook
    description: >-
      What the job market looks like for an occupation in an area, one row per
      SOC 2020 unit group and area (English regions, Wales, Scotland, Northern
      Ireland, UK): typical full-time pay (ASHE, with its precision; the UK
      figure where the area has none, labelled), online adverts over the last
      12 months against the 12 before and whether that is up or down, adverts
      open now, and the standards that lead to it. Nothing is ranked.
    config:
      meta:
        source: ashe-occupation,ons-online-job-adverts,soc-coding-index
        licence: ogl-3
        attribution: 'Source: Office for National Statistics (ASHE; online job adverts from Textkernel), licensed under the Open Government Licence v3.0.'
        refresh: daily
        sensitivity: public
        readers: ['SHARED_DB.GOLD_WARREN', 'SHARED_DB.GOLD_MEADOW', 'SHARED_DB.GOLD_SITE']
    columns:
      - name: outlook_key
        data_type: varchar
        description: 'Its key: SOC code and area code.'
        data_tests:
          - unique
          - not_null
      - name: soc2020
        data_type: varchar
        description: 'The SOC 2020 unit group.'
        data_tests:
          - not_null
      - name: soc_title
        data_type: varchar
        description: 'Its ONS title.'
        data_tests:
          - not_null
      - name: area_code
        data_type: varchar
        description: 'The area: a region (E12...), Wales, Scotland, Northern Ireland, or the UK (K02000001).'
        data_tests:
          - not_null
      - name: area_name
        data_type: varchar
        description: 'Its name.'
        data_tests:
          - not_null
      - name: geography
        data_type: varchar
        description: 'region, country or uk.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['region', 'country', 'uk']
      - name: pay_median
        data_type: number(14,2)
        description: 'Median gross annual pay for full-time employees in this occupation (ASHE, by place of work), in pounds; empty where ONS publishes none for the area or the UK.'
      - name: pay_p25
        data_type: number(14,2)
        description: 'The 25th percentile of that pay.'
      - name: pay_p75
        data_type: number(14,2)
        description: 'The 75th percentile of that pay.'
      - name: pay_area
        data_type: varchar
        description: 'Where the pay figure is for: this area, or United Kingdom when ONS publishes no figure for the area.'
      - name: pay_precision
        data_type: varchar
        description: 'ONSs band for the medians precision (its coefficient of variation): precise (up to 5%), reasonably precise (5 to 10%), acceptable, use with caution (10 to 20%).'
        data_tests:
          - accepted_values:
              arguments:
                values: ['precise', 'reasonably precise', 'acceptable, use with caution', 'precision not stated']
      - name: pay_year
        data_type: number(38,0)
        description: 'The ASHE year of the pay figure.'
      - name: pay_provisional
        data_type: boolean
        description: 'True when that years figures are provisional (ONS revises them a year later).'
      - name: adverts_last_12_months
        data_type: number(38,0)
        description: 'New online job adverts for this occupation and area in the last 12 months (ONS, from Textkernel; official statistics in development); empty when ONS left out any of those months.'
      - name: adverts_previous_12_months
        data_type: number(38,0)
        description: 'The same for the 12 months before; empty when any is missing.'
      - name: adverts_months_not_published
        data_type: number(38,0)
        description: 'Months in those 24 that ONS did not publish ([x]).'
      - name: adverts_compared_months
        data_type: number(38,0)
        description: 'How many of the last 12 months could be compared like for like with the same month a year before (both published).'
      - name: adverts_change_percent
        data_type: number(8,1)
        description: 'The change over the compared months (each against the same month a year before), as a percentage; empty with fewer than 6.'
      - name: adverts_trend
        data_type: varchar
        description: 'up or down (a change of more than 5% over the compared months), about the same, or empty with fewer than 6 compared months. The 5% threshold is Rarebit''s own rule, not ONS''s. Never a ranking.'
        data_tests:
          - accepted_values:
              arguments:
                values: ['up', 'down', 'about the same']
      - name: adverts_last_month
        data_type: date
        description: 'The last month of the adverts figures.'
      - name: open_adverts
        data_type: number(38,0)
        description: 'Adverts for this occupation open now in the area (live, closing date to come).'
        config:
          meta:
            source: 'faa-vacancies'
            attribution: 'Contains public sector information licensed under the Open Government Licence v3.0. NHS Jobs and Civil Service Jobs adverts come through the same API; their re-use terms are assumed, not confirmed.'
        data_tests:
          - not_null
      - name: standards_count
        data_type: number(38,0)
        description: 'How many apprenticeship standards lead to this occupation.'
        config:
          meta:
            source: 'skills-england'
            attribution: '© Skills England 2025. This information is licensed under the Open Government Licence https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/'
        data_tests:
          - not_null
      - name: standards
        data_type: variant
        description: 'Those standards: reference, LARS code and title.'
        config:
          meta:
            source: 'skills-england'
            attribution: '© Skills England 2025. This information is licensed under the Open Government Licence https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/'
      - name: source
        data_type: varchar
        description: 'The data sets the row draws on.'
        data_tests:
          - not_null
      - name: pay_source_file_id
        data_type: varchar
        description: 'The ASHE file the pay is from.'
      - name: pay_downloaded_on
        data_type: date
        description: 'When we downloaded it.'
      - name: pay_published_on
        data_type: date
        description: 'When ONS published it, as its page states.'
      - name: adverts_source_file_id
        data_type: varchar
        description: 'The online adverts file.'
      - name: adverts_downloaded_on
        data_type: date
        description: 'When we downloaded it.'
      - name: adverts_published_on
        data_type: date
        description: 'When ONS published it, as its page states.'
      - name: as_of
        data_type: timestamp_ltz
        description: 'When this table was made (golds build).'
        data_tests:
          - not_null

  - name: area_profile
    description: >-
      What a local authority is like, one row per authority, described in
      words against similar areas and England and never ranked: population,
      deprivation, crime and anti-social behaviour per 1,000 people with how
      they compare and whether rising or falling (like for like), fuel
      poverty, and the most-advertised occupations. Crime is England and Wales
      (police.uk has no Police Scotland data), using only months the area's
      force sent in full (at least half its usual month) and that are not
      far below the area's own usual month (under a quarter, where that is
      20 or more: a force can leave one kind out for part of its area); none
      where no force
      recorded reports in at least half the area's LSOAs (Greater Manchester
      Police sends none to police.uk). POLICE_DATA_NOTE says why any figures
      are missing or held back (the City of London gets counts, not rates, as
      so few people live there). The 10%, 5%, half and quarter thresholds and the
      similar-areas grouping are Rarebit's own rules,
      not ONS's or the police's.
    config:
      meta:
        source: onspd,nomis-nm-31-1,iod-2025,police-uk-street,fuel-poverty-sub-regional,ons-online-job-adverts
        licence: ogl-3
        attribution: 'Contains public sector information licensed under the Open Government Licence v3.0. Source: Office for National Statistics, licensed under the Open Government Licence v3.0.'
        refresh: daily
        sensitivity: public
        readers: ['SHARED_DB.GOLD_MEADOW', 'SHARED_DB.GOLD_SITE']
    columns:
      - name: local_authority_code
        data_type: varchar
        description: 'The local authority (todays code).'
        data_tests:
          - unique
          - not_null
      - name: name
        data_type: varchar
        description: 'Its name.'
        data_tests:
          - not_null
      - name: region_name
        data_type: varchar
        description: 'Its region (England).'
      - name: country_name
        data_type: varchar
        description: 'Its country.'
      - name: population
        data_type: number(38,0)
        description: 'Its latest mid-year population estimate (England and Wales).'
      - name: population_year
        data_type: number(38,0)
        description: 'The year of that estimate.'
      - name: lsoas
        data_type: number(38,0)
        description: 'How many 2021 LSOAs it has (England).'
      - name: most_deprived_10_percent_share
        data_type: number(5,1)
        description: 'The percentage of its LSOAs in England''s most deprived 10% (IMD 2025).'
      - name: rural_urban_class
        data_type: varchar
        description: 'The 2021 rural-urban class most of its postcodes are in (part of the similar-areas grouping).'
      - name: deprivation_fifth
        data_type: number(38,0)
        description: 'Its fifth among English authorities by the average IMD score of its LSOAs (1 the most deprived); part of the similar-areas grouping, Rarebit''s own. Not a ranking to show.'
      - name: crimes_last_12_months
        data_type: number(38,0)
        description: 'Crimes (not anti-social behaviour) in police.uk for the last 12 months, only when all 12 are complete for the area''s force.'
      - name: crime_rate_per_1000
        data_type: number(10,1)
        description: 'Those crimes per 1,000 residents (England and Wales). Empty where POLICE_DATA_NOTE says why; never empty because there was no crime.'
      - name: crime_months_present
        data_type: number(38,0)
        description: 'How many of the last 12 months are complete for crime: the area''s force sent at least half its usual month, and the area has at least a quarter of its own usual month where that is 20 or more (Rarebit''s rules).'
      - name: crime_rate_similar_areas
        data_type: number(10,1)
        description: 'The crime rate of similar areas together (same rural-urban class and deprivation fifth: Rarebit''s grouping).'
      - name: crime_similar_areas
        data_type: number(38,0)
        description: 'How many similar areas that rate is from (at least 3 to compare).'
      - name: crime_vs_similar_areas
        data_type: varchar
        description: 'higher or lower than similar areas (more than 10% apart, Rarebit''s rule), about the same, or empty.'
        data_tests:
          - accepted_values:
              arguments:
                values: ['higher', 'lower', 'about the same']
      - name: crime_rate_england
        data_type: number(10,1)
        description: 'England''s crime rate per 1,000, from the English areas with figures (all 12 months complete; not Greater Manchester).'
      - name: crime_vs_england
        data_type: varchar
        description: 'higher, lower or about the same as England (10%, Rarebit''s rule); Welsh areas are compared with England too.'
        data_tests:
          - accepted_values:
              arguments:
                values: ['higher', 'lower', 'about the same']
      - name: crime_trend_compared_months
        data_type: number(38,0)
        description: 'Months of the last 12 compared like for like with the same month a year before (both in police.uk).'
      - name: crime_change_percent
        data_type: number(8,1)
        description: 'The change over those months, as a percentage (at least 6).'
      - name: crime_trend
        data_type: varchar
        description: 'rising or falling (more than 5% over the compared months, Rarebit''s rule), about the same, or empty.'
        data_tests:
          - accepted_values:
              arguments:
                values: ['rising', 'falling', 'about the same']
      - name: asb_last_12_months
        data_type: number(38,0)
        description: 'Anti-social behaviour reports in the last 12 months (all 12 there).'
      - name: asb_rate_per_1000
        data_type: number(10,1)
        description: 'Those per 1,000 residents. Empty where POLICE_DATA_NOTE says why.'
      - name: asb_rate_england
        data_type: number(10,1)
        description: 'England''s anti-social behaviour rate per 1,000, from the English areas with figures.'
      - name: asb_change_percent
        data_type: number(8,1)
        description: 'The change in anti-social behaviour over the compared months.'
      - name: asb_trend
        data_type: varchar
        description: 'rising, falling or about the same, as for crime.'
        data_tests:
          - accepted_values:
              arguments:
                values: ['rising', 'falling', 'about the same']
      - name: crime_last_month
        data_type: date
        description: 'The last month of the police.uk figures.'
      - name: police_data_note
        data_type: varchar
        description: 'Why the crime and anti-social behaviour figures are missing or held back, in plain words (no police.uk data for Scotland, or from the area''s force; months missing; Northern Ireland''s reports carry no small-area codes; the City of London''s rates would mislead), so a blank never reads as no crime. Empty when the figures are all there.'
      - name: households
        data_type: number(38,0)
        description: 'Households (DESNZ fuel poverty statistics, England).'
      - name: fuel_poor_households
        data_type: number(38,0)
        description: 'Households in fuel poverty.'
      - name: fuel_poor_percent
        data_type: number(5,1)
        description: 'The percentage of households fuel poor (DESNZ: for general trends).'
      - name: fuel_poor_percent_england
        data_type: number(5,1)
        description: 'England''s percentage, beside it.'
      - name: fuel_poverty_year
        data_type: number(38,0)
        description: 'The year the fuel poverty figures are for.'
      - name: top_advertised_occupations
        data_type: variant
        description: 'The five SOC 2020 minor groups with most new online job adverts over the months ONS published in full for the area (at least 6 of the last 12): code, title, adverts. A list of occupations, not of areas.'
      - name: adverts_months_used
        data_type: number(38,0)
        description: 'How many months that list is from.'
      - name: population_source_file_id
        data_type: varchar
        description: 'The population file.'
      - name: population_published_on
        data_type: date
        description: 'When it was published, as stated.'
      - name: fuel_poverty_source_file_id
        data_type: varchar
        description: 'The fuel poverty workbook.'
      - name: fuel_poverty_published_on
        data_type: date
        description: 'When it was published, as stated.'
      - name: crime_source_file_id
        data_type: varchar
        description: 'The police.uk archive.'
      - name: as_of
        data_type: timestamp_ltz
        description: 'When this table was made.'
        data_tests:
          - not_null

  - name: postcode_area
    description: >-
      Where a postcode is, for Warren and Burrow: one row per postcode in the
      ONS Postcode Directory, live or terminated, with its areas by name and
      its LSOAs deprivation decile (England). A postcode is a place, not
      personal data.
    config:
      meta:
        source: onspd,onspd-lookups,iod-2025
        licence: ogl-3
        attribution: 'Source: Office for National Statistics, licensed under the Open Government Licence v3.0. Contains OS data © Crown copyright and database right 2026. Contains Royal Mail data © Royal Mail copyright and database right 2026.'
        refresh: daily
        sensitivity: public
        readers: ['SHARED_DB.GOLD_WARREN']
    columns:
      - name: postcode_compact
        data_type: varchar
        description: 'The postcode with no spaces, as typed addresses are matched.'
        data_tests:
          - unique
          - not_null
      - name: postcode
        data_type: varchar
        description: 'The postcode written the usual way.'
        data_tests:
          - not_null
      - name: is_live
        data_type: boolean
        description: 'True while it is in use.'
        data_tests:
          - not_null
      - name: terminated
        data_type: date
        description: 'When it stopped being used.'
      - name: country_code
        data_type: varchar
        description: 'Its country.'
      - name: country_name
        data_type: varchar
        description: 'Its countrys name.'
      - name: region_code
        data_type: varchar
        description: 'Its region (England).'
      - name: region_name
        data_type: varchar
        description: 'Its regions name.'
      - name: local_authority_code
        data_type: varchar
        description: 'Its local authority.'
      - name: local_authority_name
        data_type: varchar
        description: 'Its local authoritys name.'
      - name: ward_code
        data_type: varchar
        description: 'Its ward.'
      - name: ward_name
        data_type: varchar
        description: 'Its wards name.'
      - name: constituency_code
        data_type: varchar
        description: 'Its Westminster constituency.'
      - name: constituency_name
        data_type: varchar
        description: 'Its constituencys name.'
      - name: lsoa21_code
        data_type: varchar
        description: 'Its 2021 LSOA.'
      - name: lsoa21_name
        data_type: varchar
        description: 'Its LSOAs name.'
      - name: msoa21_code
        data_type: varchar
        description: 'Its 2021 MSOA.'
      - name: imd_decile
        data_type: number(38,0)
        description: 'Its LSOAs IMD 2025 decile (England; 1 the most deprived 10%).'
        config:
          meta:
            source: 'iod-2025'
            attribution: 'Contains public sector information licensed under the Open Government Licence v3.0.'
      - name: rural_urban_2021
        data_type: varchar
        description: 'The 2021 rural-urban class of its output area.'
      - name: latitude
        data_type: float
        description: 'Latitude.'
      - name: longitude
        data_type: float
        description: 'Longitude.'
