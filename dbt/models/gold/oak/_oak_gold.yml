version: 2

# Oak National Academy's curriculum, gold (decision 56): OPTIONS_DB.GOLD. No reader role yet: the
# options app is not changed (stop at gold).

models:

  - name: oak_lesson_card
    description: >-
      Oak National Academys open lessons (decision 56), one row per lesson in a unit of a sequence and exam board:
      what is behind a subject, with Oaks attribution line, the quiz question counts and the link to the lesson
      on Oaks website. Restricted lessons are in oak_restricted_lesson_link.
    config:
      meta:
        source: oak-curriculum
        licence: ogl-3
        attribution: 'Contains public sector information licensed under the Open Government Licence v3.0. Lessons by Oak National Academy.'
        refresh: monthly
        sensitivity: public
    columns:
      - name: lesson_key
        data_type: varchar
        description: 'A key made from the sequence, unit slug, lesson slug and exam board.'
        data_tests:
          - unique
          - not_null
      - name: lesson_slug
        data_type: varchar
        description: 'Oaks slug for the lesson.'
        data_tests:
          - not_null
      - name: lesson_title
        data_type: varchar
        description: 'Its title.'
        data_tests:
          - not_null
      - name: subject_slug
        data_type: varchar
        description: 'The subject.'
        data_tests:
          - not_null
      - name: subject_title
        data_type: varchar
        description: 'The subject in words.'
        data_tests:
          - not_null
      - name: unit_slug
        data_type: varchar
        description: 'Its units slug.'
        data_tests:
          - not_null
      - name: unit_title
        data_type: varchar
        description: 'Its units title.'
        data_tests:
          - not_null
      - name: key_stages
        data_type: varchar
        description: 'The key stages it is taught in, e.g. ks3, ks4.'
      - name: years
        data_type: varchar
        description: 'The school years it is taught in.'
      - name: exam_board_slug
        data_type: varchar
        description: 'Its exam board slug, where it has one.'
      - name: exam_board
        data_type: varchar
        description: 'Its exam board in words.'
      - name: oak_url
        data_type: varchar
        description: 'The lesson on Oaks website.'
        data_tests:
          - not_null
      - name: pupil_lesson_outcome
        data_type: varchar
        description: 'The outcome pupils are aimed at.'
      - name: keywords
        data_type: variant
        description: 'Keywords and what they mean.'
      - name: key_learning_points
        data_type: variant
        description: 'The key learning points.'
      - name: misconceptions
        data_type: variant
        description: 'Common misconceptions and responses.'
      - name: teacher_tips
        data_type: variant
        description: 'Tips for teachers.'
      - name: content_guidance
        data_type: variant
        description: 'Content guidance, where Oak gives any.'
      - name: supervision_level
        data_type: varchar
        description: 'Oaks supervision level, where it gives one.'
      - name: downloads_available
        data_type: boolean
        description: 'Whether Oak has downloads for it.'
      - name: starter_questions
        data_type: number(10,0)
        description: 'How many starter quiz questions it has (those with images are left out).'
        data_tests:
          - not_null
      - name: exit_questions
        data_type: number(10,0)
        description: 'How many exit quiz questions it has (those with images are left out).'
        data_tests:
          - not_null
      - name: attribution
        data_type: varchar
        description: 'Oaks attribution line for the lesson, in Oaks words.'
        data_tests:
          - not_null
      - name: licence_url
        data_type: varchar
        description: 'The Open Government Licence v3.0 page, for the link beside the attribution line.'
        data_tests:
          - not_null
      - name: downloaded_on
        data_type: date
        description: 'The date the Oak files were loaded.'
        data_tests:
          - not_null
      - name: built_from
        data_type: varchar
        description: 'What it was built from: the Oak files and the version of the parsing; the model is built again only when this changes.'
        data_tests:
          - not_null

  - name: oak_restricted_lesson_link
    description: >-
      Oak National Academys restricted lessons as link-only rows (decision 56): title, unit, exam board and a link to the
      lesson on Oaks website, and nothing else of the lesson (Oak, 27 October 2026). Subjects with no open lesson are
      seen this way.
    config:
      meta:
        source: oak-curriculum
        licence: ogl-3
        attribution: 'Contains public sector information licensed under the Open Government Licence v3.0. Lessons by Oak National Academy.'
        refresh: monthly
        sensitivity: public
    columns:
      - name: lesson_key
        data_type: varchar
        description: 'A key made from the sequence, unit slug, lesson slug and exam board.'
        data_tests:
          - unique
          - not_null
      - name: lesson_slug
        data_type: varchar
        description: 'Oaks slug for the lesson.'
        data_tests:
          - not_null
      - name: lesson_title
        data_type: varchar
        description: 'Its title.'
        data_tests:
          - not_null
      - name: subject_slug
        data_type: varchar
        description: 'The subject.'
        data_tests:
          - not_null
      - name: subject_title
        data_type: varchar
        description: 'The subject in words.'
        data_tests:
          - not_null
      - name: unit_slug
        data_type: varchar
        description: 'Its units slug.'
        data_tests:
          - not_null
      - name: unit_title
        data_type: varchar
        description: 'Its units title.'
        data_tests:
          - not_null
      - name: key_stages
        data_type: varchar
        description: 'The key stages it is taught in, e.g. ks3, ks4.'
      - name: years
        data_type: varchar
        description: 'The school years it is taught in.'
      - name: exam_board_slug
        data_type: varchar
        description: 'Its exam board slug, where it has one.'
      - name: exam_board
        data_type: varchar
        description: 'Its exam board in words.'
      - name: oak_url
        data_type: varchar
        description: 'The lesson on Oaks website.'
        data_tests:
          - not_null
      - name: note
        data_type: varchar
        description: 'Why only a link is shown.'
        data_tests:
          - not_null
      - name: attribution
        data_type: varchar
        description: 'Oaks attribution line for the lesson, in Oaks words.'
        data_tests:
          - not_null
      - name: licence_url
        data_type: varchar
        description: 'The Open Government Licence v3.0 page, for the link beside the attribution line.'
        data_tests:
          - not_null
      - name: downloaded_on
        data_type: date
        description: 'The date the Oak files were loaded.'
        data_tests:
          - not_null
      - name: built_from
        data_type: varchar
        description: 'What it was built from: the Oak files and the version of the parsing; the model is built again only when this changes.'
        data_tests:
          - not_null

  - name: oak_unit_card
    description: >-
      Oak National Academys secondary units (decision 56), one row per unit as a pathway, tier, exam board and year teach it,
      with how many of its lessons are open and how many link-only.
    config:
      meta:
        source: oak-curriculum
        licence: ogl-3
        attribution: 'Contains public sector information licensed under the Open Government Licence v3.0. Lessons by Oak National Academy.'
        refresh: monthly
        sensitivity: public
    columns:
      - name: unit_key
        data_type: varchar
        description: 'A key made from the sequence, unit slug, pathway, tier, exam board and year.'
        data_tests:
          - unique
          - not_null
      - name: subject_slug
        data_type: varchar
        description: 'The subject.'
        data_tests:
          - not_null
      - name: subject_title
        data_type: varchar
        description: 'The subject in words.'
        data_tests:
          - not_null
      - name: child_subject
        data_type: varchar
        description: 'The part of the subject (e.g. Biology under science), where Oak gives one.'
      - name: unit_slug
        data_type: varchar
        description: 'Oaks slug for the unit.'
        data_tests:
          - not_null
      - name: unit_title
        data_type: varchar
        description: 'Its title.'
        data_tests:
          - not_null
      - name: key_stage
        data_type: varchar
        description: 'ks3 or ks4.'
        data_tests:
          - not_null
      - name: year
        data_type: number(2,0)
        description: 'The school year it is taught in.'
        data_tests:
          - not_null
      - name: pathway
        data_type: varchar
        description: 'The pathway, where the subject has them.'
      - name: tier
        data_type: varchar
        description: 'foundation or higher, where the unit has a tier.'
      - name: exam_board_slug
        data_type: varchar
        description: 'The exam board slug of a key stage 4 unit.'
      - name: exam_board
        data_type: varchar
        description: 'The exam board in words.'
      - name: description
        data_type: varchar
        description: 'What the unit covers; empty when it has no open lesson.'
      - name: why_this_why_now
        data_type: varchar
        description: 'Why Oak teaches it here; empty when it has no open lesson.'
      - name: lessons
        data_type: number(10,0)
        description: 'How many lessons it lists.'
        data_tests:
          - not_null
      - name: open_lessons
        data_type: number(10,0)
        description: 'How many of them are open.'
        data_tests:
          - not_null
      - name: link_only_lessons
        data_type: number(10,0)
        description: 'How many are restricted, shown as a link only.'
        data_tests:
          - not_null
      - name: oak_url
        data_type: varchar
        description: 'The unit on Oaks website.'
      - name: attribution
        data_type: varchar
        description: 'Oaks attribution line for the lesson, in Oaks words.'
        data_tests:
          - not_null
      - name: licence_url
        data_type: varchar
        description: 'The Open Government Licence v3.0 page, for the link beside the attribution line.'
        data_tests:
          - not_null
      - name: downloaded_on
        data_type: date
        description: 'The date the Oak files were loaded.'
        data_tests:
          - not_null
      - name: built_from
        data_type: varchar
        description: 'What it was built from: the Oak files and the version of the parsing; the model is built again only when this changes.'
        data_tests:
          - not_null

  - name: oak_subject_coverage
    description: >-
      What Oak National Academys secondary curriculum covers, one row per subject (decision 56): units, open and link-only
      lessons, and quizzes. A subject with no open lesson is link-only throughout.
    config:
      meta:
        source: oak-curriculum
        licence: ogl-3
        attribution: 'Contains public sector information licensed under the Open Government Licence v3.0. Lessons by Oak National Academy.'
        refresh: monthly
        sensitivity: public
    columns:
      - name: subject_slug
        data_type: varchar
        description: 'The subject.'
        data_tests:
          - unique
          - not_null
      - name: subject_title
        data_type: varchar
        description: 'The subject in words.'
        data_tests:
          - not_null
      - name: units
        data_type: number(10,0)
        description: 'How many units.'
        data_tests:
          - not_null
      - name: lessons
        data_type: number(10,0)
        description: 'How many distinct lessons.'
        data_tests:
          - not_null
      - name: open_lessons
        data_type: number(10,0)
        description: 'How many are open.'
        data_tests:
          - not_null
      - name: link_only_lessons
        data_type: number(10,0)
        description: 'How many are restricted, shown as a link only.'
        data_tests:
          - not_null
      - name: lessons_with_quiz
        data_type: number(10,0)
        description: 'How many open lessons have a quiz here.'
        data_tests:
          - not_null
      - name: quiz_questions
        data_type: number(10,0)
        description: 'How many quiz questions the open lessons have.'
        data_tests:
          - not_null
      - name: link_only_subject
        data_type: boolean
        description: 'True when none of its lessons is open.'
        data_tests:
          - not_null
      - name: attribution
        data_type: varchar
        description: 'Oaks attribution line for the lesson, in Oaks words.'
        data_tests:
          - not_null
      - name: licence_url
        data_type: varchar
        description: 'The Open Government Licence v3.0 page, for the link beside the attribution line.'
        data_tests:
          - not_null
      - name: downloaded_on
        data_type: date
        description: 'The date the Oak files were loaded.'
        data_tests:
          - not_null
      - name: built_from
        data_type: varchar
        description: 'What it was built from: the Oak files and the version of the parsing; the model is built again only when this changes.'
        data_tests:
          - not_null

  - name: oak_quiz_question_card
    description: >-
      The starter and exit quiz questions of Oak National Academys open lessons (decision 56), one row per question, with the
      lessons title, subject and attribution. Questions with images are not here.
    config:
      meta:
        source: oak-curriculum
        licence: ogl-3
        attribution: 'Contains public sector information licensed under the Open Government Licence v3.0. Lessons by Oak National Academy.'
        refresh: monthly
        sensitivity: public
    columns:
      - name: question_key
        data_type: varchar
        description: 'A key made from the lesson, quiz and question number.'
        data_tests:
          - unique
          - not_null
      - name: lesson_slug
        data_type: varchar
        description: 'The lesson.'
        data_tests:
          - not_null
      - name: lesson_title
        data_type: varchar
        description: 'Its title.'
        data_tests:
          - not_null
      - name: subject_slug
        data_type: varchar
        description: 'The subject.'
        data_tests:
          - not_null
      - name: subject_title
        data_type: varchar
        description: 'The subject in words.'
        data_tests:
          - not_null
      - name: quiz
        data_type: varchar
        description: 'starter or exit.'
        data_tests:
          - not_null
      - name: question_number
        data_type: number(10,0)
        description: 'Its place in the quiz, from 1.'
        data_tests:
          - not_null
      - name: question_type
        data_type: varchar
        description: 'multiple-choice, short-answer, order or match.'
        data_tests:
          - not_null
      - name: question
        data_type: varchar
        description: 'The question as Oak writes it (markdown; a gap to fill is shown as a pair of curly brackets).'
        data_tests:
          - not_null
      - name: answer_count
        data_type: number(10,0)
        description: 'How many answers it has.'
        data_tests:
          - not_null
      - name: oak_url
        data_type: varchar
        description: 'The lesson on Oaks website.'
        data_tests:
          - not_null
      - name: attribution
        data_type: varchar
        description: 'Oaks attribution line for the lesson, in Oaks words.'
        data_tests:
          - not_null
      - name: licence_url
        data_type: varchar
        description: 'The Open Government Licence v3.0 page, for the link beside the attribution line.'
        data_tests:
          - not_null
      - name: built_from
        data_type: varchar
        description: 'What it was built from: the Oak files and the version of the parsing; the model is built again only when this changes.'
        data_tests:
          - not_null

  - name: oak_quiz_answer_result
    description: >-
      The answers to the questions in oak_quiz_question_card (decision 56), one row per answer; the shape is described in the silver
      model of the same name.
    config:
      meta:
        source: oak-curriculum
        licence: ogl-3
        attribution: 'Contains public sector information licensed under the Open Government Licence v3.0. Lessons by Oak National Academy.'
        refresh: monthly
        sensitivity: public
    columns:
      - name: answer_key
        data_type: varchar
        description: 'A key made from the lesson, quiz, question number and answer.'
        data_tests:
          - unique
          - not_null
      - name: question_key
        data_type: varchar
        description: 'Its question.'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('oak_quiz_question_card')
                field: question_key
      - name: lesson_slug
        data_type: varchar
        description: 'The lesson.'
        data_tests:
          - not_null
      - name: quiz
        data_type: varchar
        description: 'starter or exit.'
        data_tests:
          - not_null
      - name: question_number
        data_type: number(10,0)
        description: 'The questions place in the quiz.'
        data_tests:
          - not_null
      - name: answer_number
        data_type: number(10,0)
        description: 'The answers place in the list, from 1.'
        data_tests:
          - not_null
      - name: answer_text
        data_type: varchar
        description: 'The answer, choice or item as Oak writes it.'
        data_tests:
          - not_null
      - name: match_text
        data_type: varchar
        description: 'For a match question, what answer_text matches.'
      - name: is_correct
        data_type: boolean
        description: 'False only for a multiple-choice distractor.'
        data_tests:
          - not_null
      - name: answer_order
        data_type: number(10,0)
        description: 'For an order question, the items place in the right order.'
      - name: built_from
        data_type: varchar
        description: 'What it was built from: the Oak files and the version of the parsing; the model is built again only when this changes.'
        data_tests:
          - not_null
