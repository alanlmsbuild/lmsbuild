              arguments:
                values: ['01', '02', '03']
      - name: mode
        data_type: varchar
        description: 'Full-time, part-time, or either.'
      - name: title
        data_type: varchar
        description: 'Its title, e.g. Business and Management Practice.'
        data_tests:
