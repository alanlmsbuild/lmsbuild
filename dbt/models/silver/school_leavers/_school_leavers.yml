        description: 'The qualification it leads to, e.g. BA, BSc, FdA.'
      - name: level_code
        data_type: varchar
        description: 'Its level code in Discover Uni (KISLEVEL), as published.'
      - name: honours
        data_type: boolean
        description: 'True for an honours degree.'
      - name: foundation_year
        data_type: varchar
        description: 'Whether it has a foundation year: no, optional or compulsory.'
      - name: placement_year
        data_type: varchar
        description: 'Whether it has a placement (sandwich) year: no, optional or compulsory.'
      - name: year_abroad
        data_type: varchar
        description: 'Whether it has a year abroad: no, optional or compulsory.'
      - name: distance_learning
        data_type: varchar
        description: 'Whether it is taught at a distance: no, distance only, or optional.'
      - name: years
        data_type: number(38,0)
        description: 'How many years (stages) it lasts.'
      - name: ucas_programme_code
        data_type: varchar
        description: 'Its UCAS programme code, if it has one.'
      - name: website_url_listed
        data_type: varchar
        description: 'The link as its source lists it, cleaned to https:// (macros/url.sql): what the link check checks (SHARED_DB.EXT.WEBSITE_LINK.URL).'
        data_tests:
          - valid_website_url
      - name: website_url
        data_type: varchar
        description: 'The course''s own page on the provider''s website (decision 26), from Discover Uni, the link to show: as listed, or for a site that only answers on http, where that ends up.'
        data_tests:
          - valid_website_url
      - name: website_link_status
        data_type: varchar
        description: 'What the weekly link check found (decision 26; scripts/check-website-links.js): ok, http-only, broken, unreachable, blocked (the site refused a robot) or unchecked (not yet checked); empty when there is no link.'
        config:
          meta:
            source: website-link-check
        data_tests:
          - accepted_values:
              arguments:
                values: ['ok', 'http-only', 'broken', 'unreachable', 'blocked', 'unchecked']
      - name: website_link_hidden
        data_type: boolean
        description: 'True after two failed weekly link checks in a row: the app hides the link until a check passes.'
        config:
          meta:
            source: website-link-check
        data_tests:
          - not_null
      - name: provider_name
        data_type: varchar
        description: 'The publishing provider''s name in Discover Uni.'
        data_tests:
          - not_null
      - name: provider_country_code
        data_type: varchar
        description: 'The provider''s country code in Discover Uni (XF England, XG Northern Ireland, XH Scotland, XI Wales).'
      - name: provider_postcode
        data_type: varchar
        description: 'The postcode in the provider''s address.'
      - name: local_authority_code
        data_type: varchar
        description: 'Its local authority, from its postcode (SHARED_DB.SILVER.POSTCODE). Empty when the postcode is not in the postcode directory (overseas, or missing).'
        config:
          meta:
            source: 'onspd'
            licence: 'ogl-3'
            attribution: 'Source: Office for National Statistics, licensed under the Open Government Licence v3.0. Contains OS data © Crown copyright and database right 2026. Contains Royal Mail data © Royal Mail copyright and database right 2026.'
        data_tests:
          - relationships:
              arguments:
                to: ref('local_authority')
                field: local_authority_code
      - name: lsoa21_code
        data_type: varchar
        description: 'Its 2021 LSOA, from its postcode.'
        config:
          meta:
            source: 'onspd'
            licence: 'ogl-3'
            attribution: 'Source: Office for National Statistics, licensed under the Open Government Licence v3.0. Contains OS data © Crown copyright and database right 2026. Contains Royal Mail data © Royal Mail copyright and database right 2026.'
        data_tests:
          - relationships:
              arguments:
                to: ref('lsoa')
                field: lsoa21_code
      - name: main_subject_code
        data_type: varchar
        description: 'Its first subject''s CAH code (e.g. CAH15-01-02).'
      - name: main_subject_name
        data_type: varchar
        description: 'That subject''s name, from the LEO graduate outcomes subject list.'
        config:
          meta:
            source: 'leo-grad-cah3-subject'
            licence: 'ogl-3'
            attribution: 'Contains public sector information licensed under the Open Government Licence v3.0.'
      - name: subject_count
        data_type: number(38,0)
        description: 'How many subjects it has (more than one for a joint course).'
        data_tests:
          - not_null
      - name: subject_codes
        data_type: varchar
        description: 'All its subjects'' CAH codes, in the file''s order, joined with commas.'
      - name: source_file_id
        data_type: varchar
        description: 'The course file''s OPTIONS_DB.RAW.SOURCE_FILE row.'

  - name: university_course_outcome
    description: >-
      Discover Uni's outcome figures for each course, one row per course,
      measure and subject, exactly as HESA splits them: continuation, salary
      15 months after finishing (Graduate Outcomes) and earnings 3 years
      after (LEO). A joint course has a row for each subject HESA gives. Each
      measure has its own split, so subjects are never matched across
      measures and one subject's figures never stand for the whole course.
    config:
      meta:
        source: discover-uni,leo-grad-cah3-subject
        licence: cc-by-4
        attribution: 'Credit: HESA (www.hesa.ac.uk). Licence: CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). Changes: one row per course, measure and subject; columns renamed; withheld or unavailable values empty.'
        refresh: by-hand
        sensitivity: public
    columns:
      - name: outcome_key
        data_type: varchar
        description: 'Its key: the course key, the measure and the subject code, joined with |.'
        data_tests: [unique, not_null]
      - name: course_key
        data_type: varchar
        description: 'The course (UNIVERSITY_COURSE.COURSE_KEY).'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('university_course')
                field: course_key
      - name: measure
        data_type: varchar
        description: 'continuation (still studying or qualified a year on), salary_15_months (Graduate Outcomes) or earnings_3_years (LEO).'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [continuation, salary_15_months, earnings_3_years]
      - name: subject_code
        data_type: varchar
        description: 'The CAH subject (or subject group) the figures are for, as HESA gives it. Empty when HESA gives none: then the figures are for the course as a whole (continuation, often) or not available (VALUE empty).'
      - name: subject_name
        data_type: varchar
        description: 'That subject''s name, from the LEO graduate outcomes subject list (CAH2 or CAH3 level; empty for a code not in it).'
        config:
          meta:
            source: leo-grad-cah3-subject
            licence: ogl-3
            attribution: 'Contains public sector information licensed under the Open Government Licence v3.0.'
      - name: unavailable_reason
        data_type: varchar
        description: 'HESA''s code for why the figures are or are not available for this course (its UNAVAILREASON field), as published.'
      - name: aggregation
        data_type: varchar
        description: 'HESA''s code for how the figures were aggregated (over years, or a wider subject group), as published.'
      - name: aggregation_years
        data_type: varchar
        description: 'The years the figures cover, e.g. 2022-24.'
      - name: population
        data_type: number(38,0)
        description: 'The students, respondents or graduates the figures are based on.'
      - name: value
        data_type: number(38,0)
        description: 'The figure: for continuation, the percentage continuing; for salary and earnings, the median in pounds. Empty when not published.'
        data_tests:
          - between:
              arguments:
                min: 0
                max: 100
              config:
                where: "measure = 'continuation'"
      - name: lower_quartile
        data_type: number(38,0)
        description: 'Salary and earnings: the lower quartile, in pounds. Empty for continuation.'
      - name: upper_quartile
        data_type: number(38,0)
        description: 'Salary and earnings: the upper quartile, in pounds. Empty for continuation.'
      - name: source_file_id
        data_type: varchar
        description: 'The OPTIONS_DB.RAW.SOURCE_FILE row of the file the row came from.'

  - name: performance_16_18_result
    description: >-
      16 to 18 results by institution, year and cohort (all students), every
      figure exactly as published, the publishers marks kept apart, so gold
      can apply the honesty rules. Every year and cohort in the latest file.
    config:
      meta:
        source: performance-16-18
        licence: ogl-3
        attribution: 'Contains public sector information licensed under the Open Government Licence v3.0.'
        refresh: by-hand
        sensitivity: public
    columns:
      - name: result_key
        data_type: varchar
        description: 'Its key: URN, time period and cohort, joined with |.'
        data_tests:
          - unique
          - not_null
      - name: urn
        data_type: varchar
        description: 'The institutions URN.'
        data_tests:
          - not_null
      - name: time_period
        data_type: varchar
        description: 'The year as the file gives it, e.g. 202425.'
        data_tests:
          - not_null
      - name: academic_year
        data_type: varchar
        description: 'The academic year, e.g. 2024/25.'
        data_tests:
          - not_null
      - name: cohort
        data_type: varchar
        description: 'The cohort: A level, Applied general, Tech level, Academic, Technical certificate or E/M measures.'
        data_tests:
          - not_null
      - name: results_name
        data_type: varchar
        description: 'The institutions name in the results.'
      - name: students_published
        data_type: varchar
        description: 'Students who finished 16 to 18 study there (the whole institution), as published (text: a number, or the publisher''s mark c, low, x or z).'
      - name: grade_published
        data_type: varchar
        description: 'Average grade per entry, as published (text: a number, or the publisher''s mark c, low, x or z).'
      - name: grade_base_published
        data_type: varchar
        description: 'Students the average grade (and progress) is based on, as published (text: a number, or the publisher''s mark c, low, x or z).'
      - name: best3_grade_published
        data_type: varchar
        description: 'Average grade of students best three A levels, as published (text: a number, or the publisher''s mark c, low, x or z).'
      - name: best3_base_published
        data_type: varchar
        description: 'Students the best three is based on, as published (text: a number, or the publisher''s mark c, low, x or z).'
      - name: progress_published
        data_type: varchar
        description: 'Progress banding (e.g. Above average), as published (text: a number, or the publisher''s mark c, low, x or z).'
      - name: value_added_published
        data_type: varchar
        description: 'Value added score, as published (text: a number, or the publisher''s mark c, low, x or z).'
      - name: value_added_lower_published
        data_type: varchar
        description: 'Lower end of its confidence interval, as published (text: a number, or the publisher''s mark c, low, x or z).'
      - name: value_added_upper_published
        data_type: varchar
        description: 'Upper end of its confidence interval, as published (text: a number, or the publisher''s mark c, low, x or z).'
      - name: retained_percent_published
        data_type: varchar
        description: 'Percentage retained to the end of the main study programme, as published (text: a number, or the publisher''s mark c, low, x or z).'
      - name: retained_base_published
        data_type: varchar
        description: 'Students the retention figure is based on, as published (text: a number, or the publisher''s mark c, low, x or z).'
      - name: source_file_id
        data_type: varchar
        description: 'The files OPTIONS_DB.RAW.SOURCE_FILE row.'

