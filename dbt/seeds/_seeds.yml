version: 2

seeds:
  - name: bus_fare_product_map
    description: >-
      How bus operators' fare product names, as published in BODS fares files,
      are classified (Rarebit's own hand-checked list; scripts/fares/build_product_map.py
      drafts it, a person checks it): the category (single, return, day, week or
      28-day), who it is for (child, 16-18, 18-21, student, adult, or
      young-person: the operator's own "YP" or "young person" where no age is
      given) and the pass it belongs to (Zoom, Zoom Beyond, YP, Megarider ...).
      A product that cannot be classified confidently is not in it: it is in
      bus_fare_unmapped, never guessed.
    config:
      meta:
        source: bods-fares
        licence: ogl-3
        attribution: 'Contains public sector information licensed under the Open Government Licence v3.0.'
        refresh: quarterly
        sensitivity: public
      column_types:
        operator: varchar
        product_name: varchar
        category: varchar
        who: varchar
        pass_name: varchar
        note: varchar
    columns:
      - name: operator
        description: 'The operator as BODS names it (the fares dataset''s operatorName).'
      - name: product_name
        description: 'The fare product''s name exactly as the operator published it.'
      - name: category
        description: 'single, return, day, week or 28-day.'
      - name: who
        description: 'child, 16-18, 18-21, student, adult or young-person.'
      - name: pass_name
        description: 'The pass or scheme it belongs to (Zoom, Zoom Beyond, YP, Megarider, Tram ...), blank for an ordinary ticket.'
      - name: note
        description: 'Anything a person checking the row wants to say.'

  - name: qualification_subject_map
    description: >-
      Filled by hand and checked by a person, never generated: the subject
      text read from a qualification's title (qualification_card.subject_raw,
      e.g. "Combined Science: Trilogy") and the school subject it belongs
      under on the cards (e.g. Science). Until a row is here the text read
      from the title is used. One row so far: the BTEC Adult Social Care
      Certificate.
    config:
      meta:
        source: ofqual-register
        licence: public-facts
        attribution: none
        refresh: by-hand
        sensitivity: public
      column_types:
        subject_raw: varchar
        subject: varchar
        note: varchar
    columns:
      - name: subject_raw
        description: 'The subject text as read from the title.'
      - name: subject
        description: 'The school subject it is shown under.'
      - name: note
        description: 'Anything a person checking the row wants to say.'

  - name: qualification_board_names
    description: >-
      Filled by hand: how an awarding organisation is named on a card, by the
      acronym the register uses (e.g. "Cambridge OCR" shown as "OCR"), for
      one card family or, with the family blank, for all of them (Pearson is
      "Pearson Edexcel" on GCSE, AS and A level cards, "Pearson" on BTEC).
      A board with no row here shows the register's acronym. Rows marked
      Proposed in the note are Rarebit's suggestion, still to be checked.
    config:
      meta:
        source: ofqual-register
        licence: public-facts
        attribution: none
        refresh: by-hand
        sensitivity: public
      column_types:
        board_acronym: varchar
        card_family: varchar
        display_name: varchar
        note: varchar
    columns:
      - name: board_acronym
        description: 'The acronym as the register gives it.'
      - name: card_family
        description: 'The card family this name is for (GCSE, AS level, A level ...); blank for every family without a row of its own.'
      - name: display_name
        description: 'The name shown on a card.'
      - name: note
        description: 'Anything a person checking the row wants to say.'

  - name: qualification_family_notes
    description: >-
      Written and checked by Rarebit, never generated: for each card family
      and level, the plain-words level ("about GCSE standard") and the
      "What is a BTEC?" style explanation, with who checked it and when.
      Empty to start: a card with no row here shows no explanation.
    config:
      meta:
        source: ofqual-register
        licence: public-facts
        attribution: none
        refresh: by-hand
        sensitivity: public
      column_types:
        card_family: varchar
        level: varchar
        plain_level: varchar
        what_is_it: varchar
        checked_by: varchar
        checked_on: date
    columns:
      - name: card_family
        description: 'GCSE, A level, AS level, T Level, Extended Project, Functional Skills or BTEC.'
      - name: level
        description: 'The level as the register gives it; empty when the note covers every level of the family.'
      - name: plain_level
        description: 'The level in plain words.'
      - name: what_is_it
        description: 'The plain explanation of what the qualification is.'
      - name: checked_by
        description: 'Who checked the wording.'
      - name: checked_on
        description: 'The date it was checked.'
  - name: train_journey
    description: >-
      The 13 train journeys the reach page's fares panel covers (Rarebit's own list,
      agreed with Alan on 28 October 2026): the 10 pairs among Sheffield, Meadowhall,
      Rotherham Central, Barnsley and Doncaster, and Sheffield to Leeds, Manchester
      Piccadilly and Chesterfield. Stations by their 3-letter CRS code (Barnsley is BNY).
      A journey is a pair of stations, the same both ways.
    config:
      meta:
        source: rdg-fares
        licence: nre-feeds-v3
        attribution: 'Powered by National Rail Enquiries (https://www.nationalrail.co.uk/). Fares as published by the Rail Delivery Group.'
        refresh: by-hand
        sensitivity: public
      column_types:
        journey_key: varchar
        from_crs: varchar
        to_crs: varchar
        from_label: varchar
        to_label: varchar
    columns:
      - name: journey_key
        description: 'Its key: the two CRS codes joined with -.'
        data_tests: [unique, not_null]
      - name: from_crs
        description: 'The first station''s CRS code.'
        data_tests: [not_null]
      - name: to_crs
        description: 'The second station''s CRS code.'
        data_tests: [not_null]
      - name: from_label
        description: 'The first station as the page names it.'
        data_tests: [not_null]
      - name: to_label
        description: 'The second station as the page names it.'
        data_tests: [not_null]
  - name: train_route_name
    description: >-
      Plain names for the fare routes the train fares panel can show (Rarebit's own list,
      hand-checked): the feed names routes in 16 capital letters ("TPE ONLY", "NOT VIA
      DONCASTR"), and this gives the words the page shows, with the feed's own name kept
      beside each. Only the routes the listed journeys use are here; any other route shows
      the feed's name as it is published. Route 01000 has no name in the feed (just a full stop).
    config:
      meta:
        source: rdg-fares
        licence: nre-feeds-v3
        attribution: 'Powered by National Rail Enquiries (https://www.nationalrail.co.uk/). Fares as published by the Rail Delivery Group.'
        refresh: by-hand
        sensitivity: public
      column_types:
        route_code: varchar
        feed_name: varchar
        display_name: varchar
    columns:
      - name: route_code
        description: 'The feed''s 5-character route code.'
        data_tests: [unique, not_null]
      - name: feed_name
        description: 'The route''s name exactly as the feed publishes it.'
        data_tests: [not_null]
      - name: display_name
        description: 'The name the page shows, in plain words.'
        data_tests: [not_null]
  - name: train_ticket_kind
    description: >-
      The kinds of train ticket the fares panel shows, and the feed's ticket code for each
      (Rarebit's own list, checked against the feed's ticket types file): Anytime and
      Off-Peak day singles and day returns, the Anytime and Off-Peak returns used on longer
      journeys (Sheffield to Manchester), and the 7-day season. Anything else in the feed
      (Advance, first class, rail rovers) is not shown.
    config:
      meta:
        source: rdg-fares
        licence: nre-feeds-v3
        attribution: 'Powered by National Rail Enquiries (https://www.nationalrail.co.uk/). Fares as published by the Rail Delivery Group.'
        refresh: by-hand
        sensitivity: public
      column_types:
        ticket_code: varchar
        kind: varchar
        label: varchar
        sort_order: number
    columns:
      - name: ticket_code
        description: 'The feed''s 3-character ticket code.'
        data_tests: [unique, not_null]
      - name: kind
        description: 'The kind of ticket, as a key.'
        data_tests: [unique, not_null]
      - name: label
        description: 'The ticket''s name as the page shows it (the feed''s own name, in full words).'
        data_tests: [not_null]
      - name: sort_order
        description: 'The order the page lists them in.'
        data_tests: [not_null]
