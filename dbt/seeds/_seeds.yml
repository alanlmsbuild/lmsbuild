version: 2

seeds:
  - name: bus_fare_product_map
    description: >-
      How bus operators' fare product names, as published in BODS fares files,
      are classified (Rarebit's own hand-checked list; scripts/fares/build_product_map.py
      drafts it, a person checks it): the category (single, return, day, week or
      28-day), who it is for (child, 16-18, 18-21, student, adult, or
      young-person: the operator's own "YP" or "young person" where no age is
      given) and the pass it belongs to (Zoom, Zoom Beyond, YP, Megarider ...).
      A product that cannot be classified confidently is not in it: it is in
      bus_fare_unmapped, never guessed.
    config:
      meta:
        source: bods-fares
        licence: ogl-3
        attribution: 'Contains public sector information licensed under the Open Government Licence v3.0.'
        refresh: quarterly
        sensitivity: public
      column_types:
        operator: varchar
        product_name: varchar
        category: varchar
        who: varchar
        pass_name: varchar
        note: varchar
    columns:
      - name: operator
        description: 'The operator as BODS names it (the fares dataset''s operatorName).'
      - name: product_name
        description: 'The fare product''s name exactly as the operator published it.'
      - name: category
        description: 'single, return, day, week or 28-day.'
      - name: who
        description: 'child, 16-18, 18-21, student, adult or young-person.'
      - name: pass_name
        description: 'The pass or scheme it belongs to (Zoom, Zoom Beyond, YP, Megarider, Tram ...), blank for an ordinary ticket.'
      - name: note
        description: 'Anything a person checking the row wants to say.'

  - name: qualification_subject_map
    description: >-
      Filled by hand and checked by a person, never generated: the subject
      text read from a qualification's title (qualification_card.subject_raw,
      e.g. "Combined Science: Trilogy") and the school subject it belongs
      under on the cards (e.g. Science). Empty to start: until a row is here
      the text read from the title is used.
    config:
      meta:
        source: ofqual-register
        licence: public-facts
        attribution: none
        refresh: by-hand
        sensitivity: public
      column_types:
        subject_raw: varchar
        subject: varchar
        note: varchar
    columns:
      - name: subject_raw
        description: 'The subject text as read from the title.'
      - name: subject
        description: 'The school subject it is shown under.'
      - name: note
        description: 'Anything a person checking the row wants to say.'

  - name: qualification_board_names
    description: >-
      Filled by hand: how an awarding organisation is named on a card, by the
      acronym the register uses (e.g. "Cambridge OCR" shown as "OCR"). Empty
      to start: the register's acronym is used.
    config:
      meta:
        source: ofqual-register
        licence: public-facts
        attribution: none
        refresh: by-hand
        sensitivity: public
      column_types:
        board_acronym: varchar
        display_name: varchar
        note: varchar
    columns:
      - name: board_acronym
        description: 'The acronym as the register gives it.'
      - name: display_name
        description: 'The name shown on a card.'
      - name: note
        description: 'Anything a person checking the row wants to say.'

  - name: qualification_family_notes
    description: >-
      Written and checked by Rarebit, never generated: for each card family
      and level, the plain-words level ("about GCSE standard") and the
      "What is a BTEC?" style explanation, with who checked it and when.
      Empty to start: a card with no row here shows no explanation.
    config:
      meta:
        source: ofqual-register
        licence: public-facts
        attribution: none
        refresh: by-hand
        sensitivity: public
      column_types:
        card_family: varchar
        level: varchar
        plain_level: varchar
        what_is_it: varchar
        checked_by: varchar
        checked_on: date
    columns:
      - name: card_family
        description: 'GCSE, A level, AS level, T Level, Extended Project, Functional Skills or BTEC.'
      - name: level
        description: 'The level as the register gives it; empty when the note covers every level of the family.'
      - name: plain_level
        description: 'The level in plain words.'
      - name: what_is_it
        description: 'The plain explanation of what the qualification is.'
      - name: checked_by
        description: 'Who checked the wording.'
      - name: checked_on
        description: 'The date it was checked.'
